name: Team checkout checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run setup
      - run: npm ci
      - run: npm test
      - run: npm run build
