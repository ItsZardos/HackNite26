<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undertone Reader</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../public/brand/mascot.css">
  <link rel="icon" type="image/png" href="../public/brand/icon-32.png">
</head>
<body>
  <header>
    <span class="brand brand-lockup"><button class="mascot-toggle" type="button" aria-label="Pause mascot animation" aria-pressed="true" title="Pause mascot animation"><img class="mascot" src="../public/brand/monkey.png" alt="" width="56" height="56"></button><span>undertone<span class="brand-dot">.</span></span></span>
    <div class="header-right"><button id="exit" class="text-button" hidden>New text</button></div>
  </header>

  <main id="welcome">
    <div class="eyebrow">READER</div>
    <h1 id="entry-title" tabindex="-1">Use the extension.</h1>
    <p id="entry-copy">Choose Paste text, Scan page, or Import file from Undertone in your browser toolbar. Your reader opens when the text is ready.</p>
  </main>

  <main id="reading" hidden>
    <div class="reading-heading">
      <h1 id="article-title"></h1>
      <div id="byline"></div>
    </div>
    <article id="sections" aria-label="Reading text" aria-describedby="reading-hint" tabindex="0"></article>
    <div class="reading-progress"><span id="reading-hint">Scroll to continue</span><span id="page-progress" role="status" aria-live="polite"></span></div>
  </main>

  <div id="message" role="status" aria-live="polite" hidden></div>

  <footer id="player" aria-label="Background music" hidden>
    <div class="player-inner">
      <button id="play" type="button" aria-label="Play soundtrack" data-playing="false">
        <svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6Z"/></svg>
        <svg class="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M6 4h3v12H6zm5 0h3v12h-3z"/></svg>
      </button>
      <span id="mood" aria-label="Music mood: calm">Calm</span>
      <span id="play-status" class="sr-only" role="status" aria-live="polite">Press play for background music</span>
      <label class="volume"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8h3l4-4v12l-4-4H3zM13 7q4 3 0 6"/></svg><span class="sr-only">Volume</span><input id="volume" type="range" min="0" max="100" value="35"></label>
    </div>
  </footer>
  <script type="module" src="app.js"></script>
  <script type="module" src="../public/brand/mascot.js"></script>
</body>
</html>
