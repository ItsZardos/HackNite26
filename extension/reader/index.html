<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undertone Reader</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../public/brand/mascot.css">
  <link rel="icon" type="image/png" href="../public/brand/icon-32.png">
</head>
<body>
  <header>
    <a class="brand brand-lockup" href="index.html" aria-label="Undertone reader"><img class="mascot" src="../public/brand/monkey.png" alt="" width="56" height="56"><span>undertone<span class="brand-dot">.</span></span></a>
    <div class="header-right"><button id="exit" class="text-button" hidden>New text</button></div>
  </header>

  <main id="welcome">
    <div class="eyebrow">READER</div>
    <h1 id="entry-title" tabindex="-1">Open a text.</h1>
    <p id="entry-copy">Open Undertone from your browser toolbar, then choose Paste text or Scan page.</p>
    <button id="demo" class="text-button" type="button" hidden>Try sample text</button>
  </main>

  <main id="reading" hidden>
    <aside class="reading-aside">
      <div class="eyebrow">NOW READING</div>
      <p id="source-label"></p>
      <div class="aside-rule"></div>
      <div id="chapter-count"></div>
    </aside>
    <article>
      <div id="article-type" class="eyebrow"></div>
      <h1 id="article-title"></h1>
      <div id="byline"></div>
      <div id="sections"></div>
      <div class="end-mark"><button id="another" class="text-button">New text</button></div>
    </article>
  </main>

  <div id="message" role="status" aria-live="polite" hidden></div>

  <footer id="player" hidden>
    <div class="player-top">
      <div class="mood-group">
        <span class="mood-light"></span>
        <div><span class="tiny">CURRENT FEELING</span><div><strong id="mood">Calm</strong><span id="intensity">24%</span></div></div>
      </div>
      <div class="playback">
        <button id="play" aria-label="Play soundtrack">▶</button>
        <div><span id="play-status" role="status" aria-live="polite">Press play to start</span><small id="music-direction">Original ambient score</small></div>
      </div>
      <label class="volume">Volume <input id="volume" type="range" min="0" max="100" value="55"></label>
      <div class="progress-copy"><span id="progress">0%</span><small>THROUGH THE STORY</small></div>
    </div>
    <nav id="timeline" aria-label="Emotional journey"></nav>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
