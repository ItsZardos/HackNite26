<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undertone Reader</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../public/brand/mascot.css">
  <link rel="icon" type="image/png" href="../public/brand/icon-32.png">
</head>
<body>
  <header>
    <span class="brand brand-lockup"><button class="mascot-toggle" type="button" aria-label="Pause mascot animation" aria-pressed="true" title="Pause mascot animation"><img class="mascot" src="../public/brand/monkey.png" alt="" width="56" height="56"></button><span>undertone<span class="brand-dot">.</span></span></span>
    <div class="header-right"><button id="exit" class="text-button" hidden>New text</button></div>
  </header>

  <main id="welcome">
    <div class="eyebrow">READER</div>
    <h1 id="entry-title" tabindex="-1">Use the extension.</h1>
    <p id="entry-copy">Choose Paste text, Scan page, or Import file from Undertone in your browser toolbar. Your reader opens when the text is ready.</p>
  </main>

  <main id="reading" hidden>
    <div class="reading-heading">
      <h1 id="article-title"></h1>
      <div id="byline"></div>
    </div>
    <div class="focus-strip"><span id="chapter-count"></span><span id="position-hint">Scroll to continue</span></div>
    <div class="reading-window">
      <article id="sections" tabindex="0" aria-label="Reading passages" aria-describedby="position-hint"></article>
      <div id="page-measure" class="passage" aria-hidden="true"></div>
    </div>
  </main>

  <div id="message" role="status" aria-live="polite" hidden></div>

  <footer id="player" hidden>
    <div class="player-top">
      <div class="mood-group">
        <span class="mood-light"></span>
        <div><span class="tiny">CURRENT FEELING</span><div><strong id="mood">Calm</strong><span id="intensity">24%</span></div></div>
      </div>
      <div class="playback">
        <button id="play" aria-label="Play soundtrack">▶</button>
        <div><span id="play-status" role="status" aria-live="polite">Press play to start</span><small id="music-direction">Original ambient score</small></div>
      </div>
      <label class="volume">Volume <input id="volume" type="range" min="0" max="100" value="55"></label>
      <div class="progress-copy"><span id="progress">1 / 1</span><small>PASSAGE</small></div>
    </div>
    <nav id="timeline" aria-label="Emotional journey"></nav>
  </footer>
  <script type="module" src="app.js"></script>
  <script type="module" src="../public/brand/mascot.js"></script>
</body>
</html>
