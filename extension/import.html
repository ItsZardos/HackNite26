<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Import file · Undertone</title><link rel="stylesheet" href="popup.css"><link rel="stylesheet" href="import.css">
</head>
<body>
 <header><span class="wordmark">undertone<span>.</span></span></header>
 <main>
  <h1>Import file</h1>
  <p class="intro">Choose a PDF or Word DOCX to read.</p>
  <form id="import-form">
   <label for="document-file">Your document</label>
   <input id="document-file" name="document" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
   <p class="hint">Up to 20 MB. For older .doc files, save a DOCX copy first.</p>
   <button id="read-file" class="submit" type="submit">Open reader</button>
  </form>
 </main>
 <p id="status" role="status" aria-live="polite" hidden></p>
 <details id="debug" hidden><summary>Error details</summary><pre id="debug-report"></pre></details>
 <p class="privacy">Files are read locally. Extracted text is sent to Gemini. The reader opens when preparation finishes.</p>
 <script type="module" src="import.js"></script>
</body>
</html>
