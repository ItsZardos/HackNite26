<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undertone</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span class="wordmark">undertone<span>.</span></span></header>
  <main aria-label="Open a reader">
    <button id="paste" type="button">
      <span><strong>Paste text</strong><small>Open a blank reader</small></span>
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
    </button>
    <button id="scan" type="button">
      <span><strong>Scan page</strong><small>Read the current page</small></span>
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
    </button>
  </main>
  <p id="status" role="status" aria-live="polite" hidden></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
