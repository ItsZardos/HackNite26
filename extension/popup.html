<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Undertone</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="stylesheet" href="public/brand/mascot.css">
  <link rel="icon" type="image/png" href="public/brand/icon-32.png">
</head>
<body>
  <header class="brand-lockup"><button class="mascot-toggle" type="button" aria-label="Pause mascot animation" aria-pressed="true" title="Pause mascot animation"><img class="mascot" src="public/brand/monkey.png" alt="" width="72" height="72"></button><span class="wordmark">undertone<span>.</span></span></header>
  <main aria-label="Prepare a reader">
   <div id="choices">
    <button id="paste" type="button" aria-expanded="false" aria-controls="paste-form">
      <span><strong>Paste text</strong><small>Your own words</small></span>
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
    </button>
    <button id="scan" type="button">
      <span><strong>Scan page</strong><small>Read this tab</small></span>
      <svg aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
    </button>
   </div>
   <button id="import-file" class="import-choice" type="button" aria-expanded="false" aria-controls="import-form">Import file <small>PDF or DOCX</small></button>
   <form id="paste-form" hidden>
    <button id="back" class="back" type="button">Back</button>
    <label for="text">Your reading text</label>
    <textarea id="text" rows="8" minlength="80" maxlength="100000" required placeholder="Paste at least 80 characters…"></textarea>
    <button id="open-reader" class="submit" type="submit">Open reader</button>
   </form>
   <form id="import-form" hidden>
    <button id="import-back" class="back" type="button">Back</button>
    <label for="document-file">PDF or DOCX</label>
    <input id="document-file" name="document" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" required>
    <p class="file-hint">Up to 20 MB.</p>
    <button id="read-file" class="submit" type="submit">Review text</button>
   </form>
   <form id="review-form" hidden>
    <button id="review-back" class="back" type="button">Back</button>
    <label for="review-text">Check your text</label>
    <textarea id="review-text" rows="7" minlength="80" maxlength="100000" required></textarea>
    <p class="file-hint">Edit anything the file reader missed.</p>
    <button id="open-reviewed" class="submit" type="submit">Open reader</button>
   </form>
  </main>
  <p id="status" role="status" aria-live="polite" hidden></p>
  <details id="debug" hidden>
    <summary>Error details</summary>
    <pre id="debug-report" tabindex="0"></pre>
    <button id="copy-debug" type="button">Copy debug report</button>
    <p>Right-click → Inspect → Console. Filter “Undertone”.</p>
  </details>
  <p id="connection" role="status" hidden></p>
  <p class="privacy">Files stay local. Text goes to Gemini.</p>
  <script type="module" src="popup.js"></script>
  <script type="module" src="public/brand/mascot.js"></script>
</body>
</html>
